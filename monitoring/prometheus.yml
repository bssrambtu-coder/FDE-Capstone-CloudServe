# Prometheus scrape configuration for the CloudServe triage system (B-12).
#
#   python3 -m src.api --backend hybrid
#   scrape path: /metrics/prometheus on 127.0.0.1:8000
#   prometheus --config.file=monitoring/prometheus.yml
#
# Keep the local API running while Prometheus scrapes it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "support-system"
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["localhost:8000"]
